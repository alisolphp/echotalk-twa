pluginManagement {
    repositories {
        maven { url = uri("local-maven-repo") }   // مخزن محلی ما
        maven { url 'https://maven.aliyun.com/repository/google' }
        maven { url 'https://maven.aliyun.com/repository/gradle-plugin' }
        maven { url 'https://maven.aliyun.com/repository/public' }
        maven { url 'https://mirror-maven.runflare.com/repository/public/' }
        maven { url 'https://maven.myket.ir' }
        // google() را موقتاً غیرفعال می‌کنیم
        gradlePluginPortal()
        mavenCentral()
    }
}
dependencyResolutionManagement {
    repositoriesMode.set(RepositoriesMode.FAIL_ON_PROJECT_REPOS)
    repositories {
        maven { url 'https://maven.aliyun.com/repository/google' }
        maven { url 'https://maven.aliyun.com/repository/public' }
        maven { url 'https://mirror-maven.runflare.com/repository/public/' }
        maven { url 'https://maven.myket.ir' }
        google() // اینجا google بودن بهتر است، اما می‌تواند از آینه‌ها بیاید
        mavenCentral()
    }
}
rootProject.name = "echotalk-twa"
include ':app'
